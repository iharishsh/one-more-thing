services:
  postgres:
    image: postgres:16-alpine
    container_name: one-more-thing-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: one_more_thing
    volumes:
      - one_more_thing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d one_more_thing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  one_more_thing_pgdata:
